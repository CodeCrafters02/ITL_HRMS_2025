        <title>HRMS</title>

        <!-- Stale-build guard: a cached copy of this page (Teams keeps one for a long time) points at chunk files a newer deploy deleted -->
        <script>
            (function () {
                var BUILD = '__BUILD_ID__';
                if (BUILD === 'dev') return;
                var stale = false;
                function hardReload() {
                    try {
                        var url = new URL(window.location.href);
                        var last = Number(url.searchParams.get('_v')) || 0;
                        try { last = Math.max(last, Number(sessionStorage.getItem('hrms_reload_at')) || 0); } catch (e) {}
                        if (Date.now() - last < 30000) return false;
                        try { sessionStorage.setItem('hrms_reload_at', String(Date.now())); } catch (e) {}
                        // New query string = cache miss, so the latest index.html is fetched from the server
                        url.searchParams.set('_v', String(Date.now()));
                        window.location.replace(url.href);
                        return true;
                    } catch (e) {
                        return false;
                    }
                }
                function check() {
                    fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
                        .then(function (r) { return r.ok ? r.json() : null; })
                        .then(function (v) {
                            if (!v || !v.id || v.id === BUILD) return;
                            stale = true;
                            // Just loaded: nothing to lose, reload now. Otherwise wait for the next page navigation.
                            if (performance.now() < 15000) hardReload();
                        })
                        .catch(function () {});
                }
                window.addEventListener('vite:preloadError', function (e) {
                    if (hardReload()) e.preventDefault();
                });
                var pushState = history.pushState;
                history.pushState = function () {
                    pushState.apply(this, arguments);
                    if (stale) hardReload();
                };
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') check();
                });
                setInterval(check, 5 * 60 * 1000);
                check();
            })();
        </script>

        <!-- Instant Microsoft OAuth Popup Callback Relay (zero-delay popup handoff & close) -->
        <script>
            (function() {
                try {
                    if (window.location.pathname.startsWith('/auth/callback/microsoft')) {
                        var params = new URLSearchParams(window.location.search);
                        var code = params.get('code');
                        var err = params.get('error') || params.get('error_description');
                        var state = params.get('state');

                        // Detect popup using state query param, window name, opener, or popup dimensions
                        var isPopup = state === 'ms_popup' ||
                                      window.name === 'ms_login_popup' ||
                                      !!window.opener ||
                                      localStorage.getItem('ms_auth_in_progress') === 'true' ||
                                      (window.outerWidth > 0 && window.outerWidth < 800) ||
                                      (window.innerWidth > 0 && window.innerWidth < 800);

                        if (code || err) {
                            var payload = { code: code || undefined, error: err || undefined, timestamp: Date.now() };
                            try { localStorage.setItem('ms_auth_result', JSON.stringify(payload)); } catch(e) {}
                            try {
                                var ch = new BroadcastChannel('ms_auth_channel');
                                ch.postMessage(payload);
                            } catch(e) {}
                            try {
                                if (window.opener && !window.opener.closed) {
                                    window.opener.postMessage({ type: err ? 'MS_AUTH_ERROR' : 'MS_AUTH_CODE', code: code, error: err }, window.location.origin);
                                }
                            } catch(e) {}
                        }

                        if (isPopup) {
                            // Close popup immediately so main window can resume
                            try { window.close(); } catch(e) {}

                            // Retry close repeatedly in case browser was handling the cross-origin transition
                            var closeAttempts = 0;
                            var closeInterval = setInterval(function() {
                                closeAttempts++;
                                try { window.close(); } catch(e) {}
                                if (closeAttempts >= 30) clearInterval(closeInterval);
                            }, 50);
                        }
                    }
                } catch(e) {}
            })();
        </script>
